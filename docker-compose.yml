# Local development services. Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vidflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # S3-compatible object storage. Production uses Cloudflare R2 or AWS S3.
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: vidflow
      RUSTFS_SECRET_KEY: vidflow-secret-key
      RUSTFS_VOLUMES: /data
    ports:
      - '9000:9000'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
