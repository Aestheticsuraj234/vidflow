# Local monitoring for the dev stack: Prometheus on :9090, Grafana on :3001.
#   docker compose -f deploy/observability/docker-compose.yml up -d
# Host networking so Prometheus can reach the API (:4000) and workers (:9465-9469).
services:
  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--web.listen-address=:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: '3001'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vidflow.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
