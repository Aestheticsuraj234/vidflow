# Scrapes the API and every worker. Local dev: services run on the host
# (network_mode: host). In Compose/Kubernetes, replace the targets with
# service names, or use service discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['localhost:4000']
    # authorization: {credentials: <METRICS_TOKEN>}   # when the API sets one
  - job_name: workers
    static_configs:
      - targets: ['localhost:9465']
        labels: {worker: probe}
      - targets: ['localhost:9466']
        labels: {worker: transcode}
      - targets: ['localhost:9467']
        labels: {worker: package}
      - targets: ['localhost:9468']
        labels: {worker: thumbnail}
      - targets: ['localhost:9469']
        labels: {worker: notify}
